url: https://ghrieb.github.io/rnaSentry/
template:
  bootstrap: 5
  package: pkgdown
reference:
  - title: End-to-end orchestration
    desc: Run the full guarded discovery pipeline from a SummarizedExperiment.
    contents:
      - run_rnaSentry
  - title: Signature construction and locking
    desc: Build a stable Cox-driven gene signature with explicit cross-validation
      stability reporting, then lock it for export.
    contents:
      - build_signature
      - lock_signature
  - title: Auditing stages (gated, not silent)
    desc: Sample identity, quality control, confounding and batch design
      detection, principal-component audit, and the documented XIST-based sex
      check. Each stage reports its supporting statistic and a plain-language
      rationale.
    contents:
      - qc_explore
      - sex_check
      - pca_audit
      - design_audit
      - plot_pca_audit
  - title: Survival modeling
    desc: Kaplan-Meier curves, log-rank tests, Cox proportional hazards, and
      parametric alternatives.
    contents:
      - km_curve
      - cox_model
      - survival_parametric
  - title: External validation and reporting
    desc: Validate a locked signature against public cohorts and render the
      audited report.
    contents:
      - validate_external
      - load_counts
      - generate_report
articles:
  - title: Case studies
    desc: Full walkthroughs against real public cohorts.
    contents:
      - case-study-brca
      - case-study-confounder-audit
      - case-study-small-cohort
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]
  components:
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      href: articles/index.html
news:
  cran_dates: false
